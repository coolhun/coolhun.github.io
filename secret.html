<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Secret Access</title>
        <style>
            :root {
                --bg: #0f172a;
                --panel: #111827;
                --accent: #38bdf8;
                --text: #e2e8f0;
                --danger: #f87171;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: linear-gradient(135deg, #020817, var(--bg));
                color: var(--text);
                font-family: Arial, sans-serif;
            }

            .panel {
                width: min(90vw, 420px);
                background: rgba(17, 24, 39, 0.9);
                border: 1px solid rgba(56, 189, 248, 0.35);
                border-radius: 16px;
                box-shadow: 0 20px 50px rgba(14, 165, 233, 0.18);
                padding: 2rem;
            }

            h1 {
                margin-top: 0;
                text-align: center;
                color: var(--accent);
            }

            p {
                text-align: center;
                margin-bottom: 1.5rem;
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 0.9rem;
            }

            input {
                padding: 0.9rem 1rem;
                border-radius: 10px;
                border: 1px solid rgba(148, 163, 184, 0.4);
                background: rgba(15, 23, 42, 0.8);
                color: var(--text);
                font-size: 1rem;
            }

            button {
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg, var(--accent), #2563eb);
                color: white;
                padding: 0.9rem 1rem;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                opacity: 0.95;
            }

            #error-message {
                margin-top: 1rem;
                min-height: 1.25rem;
                color: var(--danger);
                text-align: center;
            }
        </style>
        <script>
            (function () {
                function hasAccessCookie() {
                    return document.cookie.split('; ').some(function (row) {
                        return row.startsWith('site_access=');
                    });
                }

                if (hasAccessCookie()) {
                    window.location.replace('index.html');
                }
            })();
        </script>
    </head>
    <body>
        <div class="panel">
            <h1>Secret Access</h1>
            <p>Enter the password to unlock the website.</p>
            <form id="passwordForm">
                <input id="password" type="password" name="password" placeholder="Password" required>
                <button type="submit">Unlock</button>
            </form>
            <p id="error-message" aria-live="polite"></p>
        </div>

        <script>
            (function () {
                function setCookie(name, value, days) {
                    var expires = new Date();
                    expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
                    document.cookie = name + '=' + value + '; expires=' + expires.toUTCString() + '; path=/';
                }

                var form = document.getElementById('passwordForm');
                var input = document.getElementById('password');
                var errorMessage = document.getElementById('error-message');

                if (!form) return;

                form.addEventListener('submit', function (event) {
                    event.preventDefault();

                    if (input.value === 'pass_word1') {
                        setCookie('site_access', 'true', 365);
                        window.location.href = 'index.html';
                    } else {
                        errorMessage.textContent = 'Incorrect password. Please try again.';
                        input.value = '';
                        input.focus();
                    }
                });
            })();
        </script>
    </body>
</html>
